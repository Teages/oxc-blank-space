name: pkg.pr.new preview

# Continuous previews: every PR and every push to main publishes the main
# package plus all @petrea/binding-* packages to https://pkg.pr.new in a
# single publish call, so pkg.pr.new rewrites the main package's
# optionalDependencies entries pointing at the batch into preview URLs.
# Requires the pkg-pr-new GitHub App (https://github.com/apps/pkg-pr-new)
# to be installed on this repository.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['!**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pkg-pr-new-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native-build.yml
    permissions:
      contents: read

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: ${{ runner.temp }}/native-bindings
          merge-multiple: true
      - run: pnpm install
      - name: Assemble binding packages from prebuilt binaries
        run: pnpm prepare-packages
        env:
          NAPI_PREBUILT_DIR: ${{ runner.temp }}/native-bindings
      # prepare-packages intentionally mutates the root and wasm manifests;
      # resync (non-frozen) so the deps-status check inside every later
      # `pnpm` invocation doesn't hit the CI default frozen-lockfile install.
      # Unpublished optional deps are skipped with a warning, not an error
      - name: Resync lockfile with the assembled manifests
        run: pnpm install --no-frozen-lockfile
      - name: Publish preview to pkg.pr.new
        # one call for the whole batch: the root package plus every binding
        # package dir, so cross-references become pkg.pr.new URLs
        run: pnpm exec pkg-pr-new publish --packageManager=pnpm . ./npm/*
