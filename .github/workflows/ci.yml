name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm build
      # the suites run the native entries alongside the JS implementation;
      # a missing binary must fail CI, not silently skip coverage
      - run: pnpm vitest --coverage
        env:
          NATIVE_REQUIRED: '1'
      - uses: codecov/codecov-action@v3
