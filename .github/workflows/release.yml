name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  # merged release PRs, publish reruns, and prereleases all arrive here
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Cut a prerelease instead of a normal release, e.g. `beta`, `rc`, or `0`'
        required: false
        default: ''
      npm-tag:
        description: npm dist-tag to publish to. Set by uppt/release for maintenance lines; leave blank otherwise
        required: false
        default: ''

permissions: {}

env:
  NPM_TAG: ${{ inputs.npm-tag || 'latest' }}

jobs:
  # open or update a draft release PR from conventional commits
  pr:
    if: |
      !github.event.repository.fork
      && (
        (
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        ) || (
          github.event_name == 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: danielroe/uppt/pr@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.prerelease }}

  # release PR merged: tag it, cut a GitHub release, dispatch the publish run
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: danielroe/uppt/release@09882a5a0a1a20a0e802613a77ad59fcb1c1611c # v0.6.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # the chained dispatch lands here on the vX.Y.Z tag: build every platform
  # binary + the wasm module first
  native:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/native-build.yml
    permissions:
      contents: read

  # assemble the binding packages from the prebuilt binaries, then publish
  # the whole batch: every @petrea/binding-* package first, then the main
  # `petrea` package whose optionalDependencies pin their exact versions
  publish:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    # the npm environment is part of the trusted publisher identity: each
    # package's publisher on npmjs.com names this repository, this workflow
    # file, and this environment
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # trusted publishing needs 11.5.1 at minimum; the runner's bundled npm
      # trails that. No auth token is configured: npm exchanges the Actions
      # OIDC token for a publish credential itself
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: ${{ runner.temp }}/native-bindings
          merge-multiple: true
      - run: pnpm install
      - name: Assemble binding packages from prebuilt binaries
        run: pnpm prepare-packages
        env:
          NAPI_PREBUILT_DIR: ${{ runner.temp }}/native-bindings
      # a rerun after a partial failure must not collide with the versions
      # that already made it out
      - name: Publish @petrea/binding-* packages
        run: |
          publish_if_needed() {
            local pkg_name pkg_version
            pkg_name=$(node -p "require('./package.json').name")
            pkg_version=$(node -p "require('./package.json').version")
            if npm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
              echo "Skipping ${pkg_name}@${pkg_version} (already published)"
              return 0
            fi
            npm publish --provenance --access public --tag "$NPM_TAG"
          }
          for pkg in npm/*/; do
            if [ -f "$pkg/package.json" ]; then
              echo "Publishing $(basename "$pkg")..."
              (cd "$pkg" && publish_if_needed)
            fi
          done
      - name: Publish petrea
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${PKG_NAME}@${PKG_VERSION} (already published)"
            exit 0
          fi
          # prepack builds dist/ from src/; the binding packages ride along
          # through optionalDependencies
          npm publish --provenance --access public --tag "$NPM_TAG"
